<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Lounge & Juice Bar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
        }

        .title-container {
            text-align: center;
            width: 100%;
        }
        h1.cyber-title {
            color: #00ff66;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
            text-transform: uppercase;
        }
        .ampersand {
            color: #ff00ff;
            font-size: 1.4rem;
            font-weight: bold;
            margin: 2px 0;
            text-shadow: 0 0 8px rgba(255, 0, 255, 0.6);
        }
        h2.bar-title {
            color: #00ffff;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
            text-transform: uppercase;
        }

        .image-box {
            width: 100%;
            max-width: 360px;
            border: 2px solid #8b00ff;
            border-radius: 12px;
            overflow: hidden;
            background: #110022;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px;
            box-shadow: 0 0 12px rgba(139, 0, 255, 0.4);
            height: 95px;
        }
        .drink-img-placeholder {
            width: 30%;
            height: 100%;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
        }
        .drink-1 { background: radial-gradient(circle, #00ff66 0%, #003311 100%); }
        .drink-2 { background: radial-gradient(circle, #ff9900 0%, #331a00 100%); }
        .drink-3 { background: radial-gradient(circle, #cc33ff 0%, #2a0033 100%); }

        .tabs {
            display: flex;
            width: 100%;
            max-width: 300px;
            justify-content: space-around;
            align-items: center;
            position: relative;
        }
        .tab-item {
            font-size: 1.1rem;
            font-weight: 700;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-bottom: 4px;
        }
        .tab-item.inactive {
            color: #666666;
        }
        .tab-underline {
            width: 65px;
            height: 3px;
            background-color: #00ffff;
            box-shadow: 0 0 8px #00ffff;
            margin-top: 2px;
        }

        .choose-flavour {
            width: 100%;
            max-width: 340px;
            border: 1.5px solid #ff00ff;
            border-radius: 8px;
            text-align: center;
            padding: 6px;
            color: #ff00ff;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            box-shadow: 0 0 8px rgba(255, 0, 255, 0.3);
            text-transform: uppercase;
        }

        .products {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 360px;
        }
        .product-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 31%;
        }
        .product-circle {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            border: 2px solid #ff00ff;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #1a001a;
            position: relative;
        }
        .product-name {
            font-size: 0.75rem;
            font-weight: 600;
            color: #ffffff;
            margin-top: 6px;
            text-align: center;
        }
        .product-price {
            font-size: 0.75rem;
            font-weight: 700;
            color: #00ff66;
        }

        .cta-btn {
            width: 100%;
            max-width: 360px;
            border: 2px solid #ff00ff;
            border-radius: 10px;
            background: rgba(255, 0, 255, 0.05);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 12px;
            text-align: center;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="title-container">
        <h1 class="cyber-title">CYBER LOUNGE</h1>
        <div class="ampersand">&amp;</div>
        <h2 class="bar-title">JUICE BAR</h2>
    </div>

    <div class="image-box">
        <div class="drink-img-placeholder drink-1" title="Green Splash"></div>
        <div class="drink-img-placeholder drink-2" title="Orange Splash"></div>
        <div class="drink-img-placeholder drink-3" title="Purple Splash"></div>
    </div>

    <div>
        <div class="tabs">
            <span class="tab-item">DRINKS</span>
            <span class="tab-item inactive">PODS</span>
        </div>
        <div class="tab-underline"></div>
    </div>

    <div class="choose-flavour">CHOOSE YOUR FLAVOUR</div>

    <div class="products">
        <div class="product-item">
            <div class="product-circle">
                <div style="width:100%;height:100%;background:radial-gradient(circle, #ff6699, #660033);"></div>
            </div>
            <div class="product-name">Kaleb Moon</div>
            <div class="product-price">$10.00</div>
        </div>
        <div class="product-item">
            <div class="product-circle">
                <div style="width:100%;height:100%;background:radial-gradient(circle, #99ff33, #224400);"></div>
            </div>
            <div class="product-name">Kiwi Crisp</div>
            <div class="product-price">$10.00</div>
        </div>
        <div class="product-item">
            <div class="product-circle">
                <div style="width:100%;height:100%;background:radial-gradient(circle, #ffcc00, #443300);"></div>
            </div>
            <div class="product-name">Lime Rush</div>
            <div class="product-price">$10.00</div>
        </div>
    </div>

    <div class="cta-btn">JOIN OUR COMMUNITY</div>

</body>
</html>
